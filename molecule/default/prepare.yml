- name: Update cache
  hosts: k8s
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

- name: Harden hosts
  hosts: all
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Setup harden_linux role
      ansible.builtin.include_role:
        name: githubixx.harden_linux

- name: Setup Wireguard VPN
  hosts: vpn
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Setup wireguard role
      ansible.builtin.include_role:
        name: githubixx.ansible_role_wireguard

- name: Setup cfssl
  hosts: k8s_assets
  become: true
  gather_facts: false
  tasks:
    - name: Install cfssl
      ansible.builtin.include_role:
        name: githubixx.cfssl

- name: Setup Kubernetes certificates
  hosts: k8s_assets
  gather_facts: false
  tasks:
    - name: Generate etcd and K8s TLS certificates
      ansible.builtin.include_role:
        name: githubixx.kubernetes_ca

    - name: Copy certificate files from assets to local host
      ansible.posix.synchronize:
        mode: pull
        src: "{{ k8s_ctl_ca_conf_directory }}"
        dest: "/tmp"

- name: Setup etcd
  hosts: k8s_etcd
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Include etcd role
      ansible.builtin.include_role:
        name: githubixx.etcd

- name: Setup Kubernetes client tooling
  hosts: k8s_assets
  become: true
  gather_facts: true
  tasks:
    - name: Install kubectl
      ansible.builtin.include_role:
        name: githubixx.kubectl

    - name: Install support packages
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - conntrack
          - python3-pip

    - name: Install kubernetes Python package
      ansible.builtin.package:
        name: python3-kubernetes
        state: present

- name: Setup HAProxy
  hosts: ubuntu22
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Setup haproxy role
      ansible.builtin.include_role:
        name: githubixx.haproxy

- name: Install CNI plugins and runc
  hosts: k8s
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Include runc role
      ansible.builtin.include_role:
        name: githubixx.runc

    - name: Include CNI role
      ansible.builtin.include_role:
        name: githubixx.cni

- name: Verify etcd readiness before control plane converge
  hosts: k8s_etcd
  remote_user: vagrant
  become: true
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert etcd service is active
      ansible.builtin.assert:
        that:
          - "'etcd.service' in ansible_facts.services"
          - "ansible_facts.services['etcd.service'].state == 'running'"

    - name: Check etcd endpoint port is listening
      ansible.builtin.shell: set -o pipefail && ss -H -ltn "sport = :2379" | grep -q "LISTEN"
      args:
        executable: /bin/bash
      register: k8s_ctl__etcd_listener_before_converge
      changed_when: false
      failed_when: k8s_ctl__etcd_listener_before_converge.rc != 0
