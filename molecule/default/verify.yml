- name: Verify setup
  hosts: test-assets
  tasks:
    - name: Fetch namespaces information
      kubernetes.core.k8s_info:
        api_version: v1
        kind: namespace
        kubeconfig: "{{ k8s_admin_conf_dir }}/admin.kubeconfig"
      register: k8s__namespaces_info

    - name: Print namespaces
      ansible.builtin.debug:
        var: "{{ k8s__namespaces_info | community.general.json_query(json_query) }}"
      vars:
        json_query: "length(resources)"
      when: ansible_verbosity > 1

    - name: Register namespaces count
      ansible.builtin.set_fact:
        k8s__namespaces_count: "{{ k8s__namespaces_info | community.general.json_query(json_query) }}"
      vars:
        json_query: "length(resources)"

    - name: There should be four namespaces
      ansible.builtin.assert:
        that:
          - k8s__namespaces_count|int == 4

- name: Verify control plane service health
  hosts: k8s_controller
  become: true
  vars:
    k8s_ctl__services:
      - kube-apiserver
      - kube-controller-manager
      - kube-scheduler
  tasks:
    - name: Check service is active
      ansible.builtin.command: "systemctl is-active {{ item }}"
      register: k8s_ctl__service_active
      changed_when: false
      failed_when:
        - k8s_ctl__service_active.rc != 0
        - k8s_ctl__service_active.stdout != "active"
      loop: "{{ k8s_ctl__services }}"

    - name: Check service is enabled
      ansible.builtin.command: "systemctl is-enabled {{ item }}"
      register: k8s_ctl__service_enabled
      changed_when: false
      failed_when:
        - k8s_ctl__service_enabled.rc != 0
        - k8s_ctl__service_enabled.stdout != "enabled"
      loop: "{{ k8s_ctl__services }}"

- name: Verify control plane listener ports
  hosts: k8s_controller
  become: true
  vars:
    k8s_ctl__expected_listeners:
      - name: kube-apiserver
        port: 6443
      - name: kube-controller-manager
        port: 10257
      - name: kube-scheduler
        port: 10259
  tasks:
    - name: Check listener port is open
      ansible.builtin.shell: >
        ss -H -ltn "sport = :{{ item.port }}" | grep -q "LISTEN"
      register: k8s_ctl__listener_check
      changed_when: false
      failed_when: k8s_ctl__listener_check.rc != 0
      loop: "{{ k8s_ctl__expected_listeners }}"
      loop_control:
        label: "{{ item.name }}:{{ item.port }}"

- name: Verify Kubernetes API health endpoints
  hosts: test-assets
  tasks:
    - name: Check kube-apiserver livez endpoint
      ansible.builtin.command: >
        kubectl
        --kubeconfig={{ k8s_admin_conf_dir }}/admin.kubeconfig
        get --raw=/livez
      register: k8s_ctl__apiserver_livez
      changed_when: false
      failed_when:
        - k8s_ctl__apiserver_livez.rc != 0
        - k8s_ctl__apiserver_livez.stdout is not search("ok")

    - name: Check kube-apiserver readyz endpoint
      ansible.builtin.command: >
        kubectl
        --kubeconfig={{ k8s_admin_conf_dir }}/admin.kubeconfig
        get --raw=/readyz
      register: k8s_ctl__apiserver_readyz
      changed_when: false
      failed_when:
        - k8s_ctl__apiserver_readyz.rc != 0
        - k8s_ctl__apiserver_readyz.stdout is not search("ok")
